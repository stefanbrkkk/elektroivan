<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque Variable';
        src: url('{{FONT_DISPLAY_SRC}}') format('woff2-variations');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        src: url('{{FONT_MONO_SRC}}') format('woff2-variations');
        font-weight: 100 800;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        background: #0a0b10;
        overflow: hidden;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 90px;
        background-color: #0a0b10;
        background-image: radial-gradient(circle, rgba(243, 241, 234, 0.07) 1.5px, transparent 1.5px);
        background-size: 28px 28px;
      }

      .glow {
        position: absolute;
        top: -140px;
        right: -140px;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 185, 43, 0.35), transparent 70%);
      }

      .eyebrow {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'JetBrains Mono Variable', monospace;
        font-size: 24px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8fd8ff;
      }

      .title {
        position: relative;
        margin-top: 32px;
        max-width: 900px;
        font-family: 'Bricolage Grotesque Variable', sans-serif;
        font-weight: 800;
        font-size: 68px;
        line-height: 1.08;
        letter-spacing: -0.01em;
        color: #f3f1ea;
      }

      .description {
        position: relative;
        margin-top: 28px;
        max-width: 760px;
        font-family: 'JetBrains Mono Variable', monospace;
        font-size: 24px;
        line-height: 1.5;
        color: #9aa0b4;
      }

      .footer {
        position: relative;
        margin-top: 56px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: 'Bricolage Grotesque Variable', sans-serif;
        font-weight: 800;
        font-size: 28px;
        color: #ffb92b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <div class="eyebrow">
        <svg width="28" height="28" viewBox="0 0 32 32">
          <path d="M17.6 4L9 18h5.6l-1.4 10L23 14h-5.6l0.2-10z" fill="#ffb92b" />
        </svg>
        <span>{{EYEBROW}}</span>
      </div>
      <h1 class="title">{{TITLE}}</h1>
      <p class="description">{{DESCRIPTION}}</p>
      <div class="footer">
        <svg width="22" height="22" viewBox="0 0 32 32">
          <path d="M17.6 4L9 18h5.6l-1.4 10L23 14h-5.6l0.2-10z" fill="#ffb92b" />
        </svg>
        <span>{{WORDMARK}}</span>
      </div>
    </div>
  </body>
</html>
